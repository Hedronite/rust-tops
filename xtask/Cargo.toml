[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Repo tasks for rust-tops: `sync` writes the hand copies in copies.toml from their sources."
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[target.'cfg(unix)'.dependencies]
# `openat`/`mkdirat` without `unsafe`. 1.1.6 clears RUSTSEC-2026-0486.
rustix = { version = "1.1.6", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
