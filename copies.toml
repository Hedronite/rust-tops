# Hand copies for `cargo run -p xtask -- sync`.
# `source` is read. `dest` is the regular file sync writes.
# templates/ is the source, except the schema pair: schema/ is the source
# and the template is the dest. Sync must not write schema/.
# Not listed: init goldens under tests/golden, class workflow goldens,
# rust-toolchain.toml goldens, root deny.toml, the license pairs, and the
# kit workflow .github/workflows/rust-tops.yml.

