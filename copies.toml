# Hand copies for `cargo run -p xtask -- sync`.
# One table per source. `from` is read. `to` lists the regular files sync writes.
# Every `from` is under crates/cargo-tops/templates/ except schema/rust-tops.schema.json.
# Nothing under schema/, .github/, or crates/cargo-tops/tests/golden/ is a `to`.
# Not listed: init goldens, class workflow goldens, rust-toolchain.toml goldens,
# root deny.toml, the license pairs, and the kit workflow.

[[copy]]
from = "crates/cargo-tops/templates/skills/rust-tops-adopt/SKILL.md"
to = [
    ".agents/skills/rust-tops-adopt/SKILL.md",
    ".claude/skills/rust-tops-adopt/SKILL.md",
    ".cursor/skills/rust-tops-adopt/SKILL.md",
    ".grok/skills/rust-tops-adopt/SKILL.md",
]

