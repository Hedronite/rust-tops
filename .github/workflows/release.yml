# Release workflow for cargo-tops. Runs on a pushed `v*` tag.
#
# build        two targets, sha256 sums, build-provenance attestations
# release      one GitHub release: binaries, sums, the CHANGELOG section
# publish      crates.io through trusted publishing (OIDC), off unless the
#              repo variable CRATES_IO_TRUSTED_PUBLISHING is `true`
#
# The repository holds no long-lived crates.io token. The crates.io side
# (the trusted publisher entry) is configured by the owner, not here.
# Permissions are set per job; the workflow default is none.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      # No cache restore anywhere in this workflow: a tag build compiles what it
      # ships, so nothing a pull-request run could have written is read.
      - name: Tag matches the package version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "cargo-tops"))')"
          if [ "${TAG}" != "v${version}" ]; then
            echo "tag ${TAG} does not match cargo-tops ${version}" >&2
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p cargo-tops --target "${{ matrix.target }}"
      - name: Package and checksum
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          name="cargo-tops-${TAG}-${TARGET}"
          mkdir -p "dist/${name}"
          install -m 0755 "target/${TARGET}/release/cargo-tops" "dist/${name}/cargo-tops"
          cp LICENSE-MIT LICENSE-APACHE README.md "dist/${name}/"
          tar --create --gzip --file "dist/${name}.tar.gz" --directory dist "${name}"
          rm -rf "dist/${name}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          else
            shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi
          cat "${name}.tar.gz.sha256"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Combined sums
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: CHANGELOG section
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.raw
          # The CHANGELOG says "Not tagged or published yet." until the tag
          # exists. A published release must not carry that line.
          sed 's/ *Not tagged or published yet\.//' release-notes.raw > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no [${version}] section" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --repo "${REPO}" \
            --verify-tag \
            --title "cargo-tops ${TAG}" \
            --notes-file release-notes.md \
            dist/*.tar.gz dist/SHA256SUMS

  # Trusted publishing: the job asks crates.io for a short-lived token with
  # its OIDC identity. Off until the repo variable is `true`.
  publish:
    needs: release
    if: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # 2026-10-16
        with:
          toolchain: 1.99.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish -p cargo-tops --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
