[workspace]
resolver = "2"
members = [
    "crates/cargo-tops",
    "examples/parser-codec",
    "examples/no-std-embedded",
    "xtask",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
version = "0.2.0"
rust-version = "1.99.1"
repository = "https://github.com/Hedronite/rust-tops"

[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Binary profile of templates/lints/tops-strict.toml. [lib] lints stay off.
# too_many_lines is deny on the kit and warn in the adopter table.
all = { level = "warn", priority = -1 }
needless_pass_by_value = "warn"
implicit_clone = "warn"
unwrap_used = "warn"
panic_in_result_fn = "warn"
indexing_slicing = "warn"
let_underscore_must_use = "warn"
needless_collect = "warn"
panic = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
too_many_lines = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
