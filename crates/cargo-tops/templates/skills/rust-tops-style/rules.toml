#
# The rule catalog read by the rust-tops-style, rust-tops-review and rust-tops-port skills.
# kind = lint: `check` is a clippy or rustc lint path the style check enables with -W.
# kind = probe: `check` names a text scan the skill script runs; it decides without a model.
# kind = judgment: `check` is empty; the reviewing agent decides and answers by ID.

# ---- PANIC -------------------------------------------------------------

[[rule]]
id = "PANIC-1"
kind = "lint"
check = "clippy::unwrap_used"
skills = ["style", "review"]
rule = "No unwrap where input from outside can reach the call."
fix = "Propagate with ?, or use expect and state why the value cannot be missing."
source = "rust-best-practices §13"

[[rule]]
id = "PANIC-2"
kind = "lint"
check = "clippy::indexing_slicing"
skills = ["style", "review"]
rule = "Indexing and slicing can panic, so they are an error path when input drives the index."
fix = "Use get, first, split_at_checked or an iterator, and handle the None."
source = "rust-review §3"

[[rule]]
id = "PANIC-3"
kind = "lint"
check = "clippy::cast_possible_truncation"
skills = ["style", "review"]
rule = "An as cast that narrows a number silently drops bits."
fix = "Use try_from and handle the error, or widen the target type."
source = "rust-review §3"

[[rule]]
id = "PANIC-4"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Arithmetic on outside values must not overflow into a panic or a wrong answer."
fix = "Use checked, saturating or wrapping operations, chosen on purpose, or bound the inputs."
source = "rust-review §3"

[[rule]]
id = "PANIC-5"
kind = "judgment"
check = ""
skills = ["review", "style"]
rule = "Each expect, assert and panic message carries the values that made it fire."
fix = "Add the offending value, key or path to the message."
source = "rust-best-practices §13"

[[rule]]
id = "PANIC-6"
kind = "judgment"
check = ""
skills = ["review"]
rule = "An expected failure is returned as an error, never raised as a panic or caught with catch_unwind."
fix = "Return a Result with a variant for the case."
source = "rust-review §3"

[[rule]]
id = "PANIC-7"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A Drop impl never panics, blocks or has a failure path of its own."
fix = "Log and swallow in drop, and offer an explicit close method that returns Result."
source = "rust-review §3"

# ---- ERR ---------------------------------------------------------------

[[rule]]
id = "ERR-1"
kind = "lint"
check = "clippy::result_unit_err"
skills = ["style", "review"]
rule = "A public function must not use unit as its error type."
fix = "Define an error enum or struct that says what went wrong."
source = "rust-review §3"

[[rule]]
id = "ERR-2"
kind = "probe"
check = "box-dyn-error-api"
skills = ["style", "review"]
rule = "A library's public signature must not expose a boxed dynamic error."
fix = "Return a named error type; keep the boxed form inside binaries."
source = "rust-review §3"

[[rule]]
id = "ERR-3"
kind = "probe"
check = "anyhow-in-api"
skills = ["style", "review"]
rule = "A library's public signature must not expose anyhow types."
fix = "Return a named error type and let the application wrap it with anyhow."
source = "rust-review §3"

[[rule]]
id = "ERR-4"
kind = "lint"
check = "clippy::map_err_ignore"
skills = ["style", "review"]
rule = "map_err that discards the source error throws away the cause."
fix = "Bind the source error and carry it in the new error as its source."
source = "rust-review §3"

[[rule]]
id = "ERR-5"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Every public error type implements Display and Error, and is Send, Sync and 'static."
fix = "Derive or write the impls; thiserror is fine."
source = "rust-best-practices §13"

[[rule]]
id = "ERR-6"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Error text names the file, line or value that failed, and the underlying cause stays reachable."
fix = "Add the context fields and implement source."
source = "rust-review §3"

[[rule]]
id = "ERR-7"
kind = "probe"
check = "catch-unwind"
skills = ["style", "review"]
rule = "catch_unwind is for a foreign-call boundary, not for ordinary control flow."
fix = "Return a Result instead, or comment the boundary that needs the catch."
source = "rust-review §3"

# ---- API ---------------------------------------------------------------

[[rule]]
id = "API-1"
kind = "lint"
check = "clippy::ptr_arg"
skills = ["style", "review"]
rule = "Parameters borrow the general form: str, a slice or Path, not String, Vec or PathBuf."
fix = "Change the parameter to &str, &[T] or &Path."
source = "rust-best-practices §13"

[[rule]]
id = "API-2"
kind = "lint"
check = "clippy::borrowed_box"
skills = ["style", "review"]
rule = "A reference to a Box adds a pointless layer."
fix = "Take &T instead of &Box<T>."
source = "rust-review §3"

[[rule]]
id = "API-3"
kind = "probe"
check = "pub-bool-param"
skills = ["style", "review"]
rule = "A public function does not take a bool whose meaning is invisible at the call site."
fix = "Use a two-variant enum, or split into two named functions."
source = "rust-best-practices §13"

[[rule]]
id = "API-4"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A function must not take ownership and then clone, or borrow and then clone to get ownership."
fix = "Take the form the body needs: by value if consumed, else a borrow."
source = "rust-review §3"

[[rule]]
id = "API-5"
kind = "judgment"
check = ""
skills = ["review"]
rule = "impl Into parameters earn their cost only in library entry points that are called often."
fix = "Take the concrete type in application code."
source = "rust-review §3"

[[rule]]
id = "API-6"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A library function returns an iterator when it would otherwise build a Vec just to hand it over."
fix = "Return impl Iterator; keep Vec when callers need ownership or random access."
source = "rust-review §3"

[[rule]]
id = "API-7"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Public fields, Rc, RefCell, Arc and third-party types do not leak through a public signature."
fix = "Make fields private, wrap the foreign type, and hide the sharing inside."
source = "rust-review §3"

[[rule]]
id = "API-8"
kind = "lint"
check = "clippy::new_without_default"
skills = ["style", "review"]
rule = "A public new() with no arguments has a matching Default."
fix = "Derive Default, or implement it by calling new."
source = "rust-review §3"

[[rule]]
id = "API-9"
kind = "lint"
check = "missing_debug_implementations"
skills = ["style", "review"]
rule = "Every public type implements Debug."
fix = "Add derive(Debug), or a hand impl that hides secrets."
source = "rust-best-practices §13"

[[rule]]
id = "API-10"
kind = "lint"
check = "clippy::should_implement_trait"
skills = ["style", "review"]
rule = "A method named like a std trait method (from_str, next, add) should implement that trait."
fix = "Implement FromStr, Iterator or the operator trait instead."
source = "rust-review §3"

[[rule]]
id = "API-11"
kind = "probe"
check = "get-prefix-getter"
skills = ["style", "review"]
rule = "A plain getter is named after the field, with no get_ prefix."
fix = "Rename get_len(&self) to len(&self)."
source = "rust-review §3"

[[rule]]
id = "API-12"
kind = "lint"
check = "clippy::wrong_self_convention"
skills = ["style", "review"]
rule = "as_, to_ and into_ prefixes must match the cost and the ownership the method has."
fix = "Rename the method, or change its receiver to match the prefix."
source = "rust-review §3"

[[rule]]
id = "API-13"
kind = "probe"
check = "vague-type-name"
skills = ["style", "review"]
rule = "A type name ending in Manager, Util, Utils or Helper says nothing about what it is."
fix = "Name the type for the thing it models."
source = "rust-review §3"

[[rule]]
id = "API-14"
kind = "lint"
check = "clippy::exhaustive_enums"
skills = ["style", "review"]
rule = "A public enum that may grow is marked non_exhaustive."
fix = "Add #[non_exhaustive], or document that the variant set is closed."
source = "rust-review §3"

[[rule]]
id = "API-15"
kind = "lint"
check = "clippy::exhaustive_structs"
skills = ["style", "review"]
rule = "A public struct with public fields that may grow is marked non_exhaustive."
fix = "Add #[non_exhaustive], or make the fields private with a constructor."
source = "rust-review §3"

[[rule]]
id = "API-16"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A trait that outsiders should only use, never implement, is sealed."
fix = "Add a private supertrait so only this crate can implement it."
source = "rust-review §3"

[[rule]]
id = "API-17"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A library follows the API rules strictly; an application keeps its code plain."
fix = "Apply the stricter rules to exported items and relax them inside binaries."
source = "rust-best-practices §13"

# ---- OWN ---------------------------------------------------------------

[[rule]]
id = "OWN-1"
kind = "lint"
check = "clippy::redundant_clone"
skills = ["style", "review"]
rule = "A clone whose source is never used again is wasted."
fix = "Move the value instead of cloning it."
source = "rust-review §3"

[[rule]]
id = "OWN-2"
kind = "judgment"
check = ""
skills = ["review", "style"]
rule = "No clone exists only to quiet the borrow checker."
fix = "Restructure the borrows, shorten a scope, or pass a reference."
source = "rust-best-practices §13"

# ---- TRAIT -------------------------------------------------------------

[[rule]]
id = "TRAIT-1"
kind = "lint"
check = "clippy::derived_hash_with_manual_eq"
skills = ["style", "review"]
rule = "Derived Hash beside a hand-written PartialEq can disagree about equal values."
fix = "Derive both, or write both by hand over the same fields."
source = "rust-review §3"

[[rule]]
id = "TRAIT-2"
kind = "lint"
check = "clippy::derive_ord_xor_partial_ord"
skills = ["style", "review"]
rule = "Derived Ord beside a hand-written PartialOrd (or the reverse) can order values inconsistently."
fix = "Derive both, or implement PartialOrd by delegating to Ord."
source = "rust-review §3"

[[rule]]
id = "TRAIT-3"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A hand-written Ord agrees with the PartialEq and Hash on the same type."
fix = "Compare the same fields everywhere, or derive the set."
source = "rust-best-practices §13"

[[rule]]
id = "TRAIT-4"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Public types derive the common traits that fit them: Clone, Eq, Hash, Default and so on."
fix = "Add the derives callers would otherwise need a wrapper for."
source = "rust-best-practices §13"

# ---- UNSAFE ------------------------------------------------------------

[[rule]]
id = "UNSAFE-1"
kind = "lint"
check = "clippy::undocumented_unsafe_blocks"
skills = ["style", "review"]
rule = "Each unsafe block carries a SAFETY comment giving the reason it is sound."
fix = "Write // SAFETY: with the invariant the block relies on."
source = "rust-best-practices §13"

[[rule]]
id = "UNSAFE-2"
kind = "lint"
check = "clippy::missing_safety_doc"
skills = ["style", "review"]
rule = "A public unsafe function documents what its caller must guarantee."
fix = "Add a # Safety section to the doc comment."
source = "rust-best-practices §13"

[[rule]]
id = "UNSAFE-3"
kind = "probe"
check = "transmute-use"
skills = ["style", "review"]
rule = "transmute is a last resort, and never a way to cast enums or stretch a lifetime."
fix = "Use from_le_bytes, TryFrom, a match, or a safe wrapper type."
source = "rust-review §3"

[[rule]]
id = "UNSAFE-4"
kind = "probe"
check = "unsafe-impl-send-sync"
skills = ["style", "review"]
rule = "An unsafe impl of Send or Sync must not exist just to silence the compiler."
fix = "Fix the type so the auto trait holds, or document the invariant that makes it sound."
source = "rust-review §3"

[[rule]]
id = "UNSAFE-5"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A safe function must not allow undefined behavior through any sequence of safe calls."
fix = "Mark it unsafe, or enforce the invariant in the type."
source = "rust-review §3"

# ---- DOC ---------------------------------------------------------------

[[rule]]
id = "DOC-1"
kind = "lint"
check = "missing_docs"
skills = ["style", "review"]
rule = "Public items have documentation."
fix = "Add a doc comment that says something beyond the item's name."
source = "rust-review §3"

[[rule]]
id = "DOC-2"
kind = "lint"
check = "clippy::missing_errors_doc"
skills = ["style", "review"]
rule = "A public function returning Result lists its failure cases in an Errors section."
fix = "Add # Errors with one line per failure."
source = "rust-review §3"

[[rule]]
id = "DOC-3"
kind = "lint"
check = "clippy::missing_panics_doc"
skills = ["style", "review"]
rule = "A public function that can panic says when in a Panics section."
fix = "Add # Panics, or remove the panic."
source = "rust-review §3"

[[rule]]
id = "DOC-4"
kind = "probe"
check = "doc-example-unwrap"
skills = ["style", "review"]
rule = "Doc examples use ? and not unwrap."
fix = "Hide a fn main returning Result in the example and use ?."
source = "rust-review §3"

[[rule]]
id = "DOC-5"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A doc comment opens with a one-line summary that adds information beyond the name."
fix = "Rewrite the first line to say what the item does and when to use it."
source = "rust-best-practices §13"

# ---- IDIOM -------------------------------------------------------------

[[rule]]
id = "IDIOM-1"
kind = "probe"
check = "deny-warnings-attr"
skills = ["style", "review"]
rule = "Source never carries a crate-level deny of the warnings group."
fix = "Remove it and pass -D warnings in CI."
source = "rust-best-practices §2"

[[rule]]
id = "IDIOM-2"
kind = "lint"
check = "clippy::allow_attributes_without_reason"
skills = ["style", "review"]
rule = "A lint suppression gives its reason."
fix = "Add reason = \"...\" to the attribute."
source = "rust-review §3"

[[rule]]
id = "IDIOM-3"
kind = "lint"
check = "clippy::wildcard_imports"
skills = ["style", "review"]
rule = "No glob imports, except a framework's documented prelude and use super::* in tests."
fix = "Import the names you use."
source = "rust-best-practices §13"

[[rule]]
id = "IDIOM-4"
kind = "lint"
check = "clippy::unnecessary_unwrap"
skills = ["style", "review"]
rule = "Testing a value and then unwrapping it separately is a pattern-match in disguise."
fix = "Use if let, let else or a combinator."
source = "rust-review §3"

[[rule]]
id = "IDIOM-5"
kind = "lint"
check = "clippy::string_add"
skills = ["style", "review"]
rule = "Strings are not built with the plus operator."
fix = "Use format! or push_str."
source = "rust-review §3"

[[rule]]
id = "IDIOM-6"
kind = "lint"
check = "clippy::iter_over_hash_type"
skills = ["style", "review"]
rule = "Walking a hash map or set feeds an unspecified order into whatever comes next."
fix = "Collect and sort the keys, or use a BTreeMap."
source = "rust-review §3"

[[rule]]
id = "IDIOM-7"
kind = "lint"
check = "clippy::needless_range_loop"
skills = ["style", "review"]
rule = "An index loop that only reads each element is an iterator."
fix = "Iterate over the slice, with enumerate if the index matters."
source = "rust-review §3"

[[rule]]
id = "IDIOM-8"
kind = "lint"
check = "clippy::allow_attributes"
skills = ["style", "review"]
rule = "Prefer expect to allow so a stale suppression is reported."
fix = "Replace allow with expect, and keep the reason."
source = "rust-best-practices §2"

[[rule]]
id = "IDIOM-9"
kind = "probe"
check = "crate-lint-attr"
skills = ["style", "review"]
rule = "Lint levels live in Cargo.toml, not in scattered crate attributes."
fix = "Move the level into [lints] or [workspace.lints]."
source = "rust-best-practices §2"

[[rule]]
id = "IDIOM-10"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Pick match or a combinator by which reads better; use a loop when a chain gets long."
fix = "Rewrite the one that takes a second look to follow."
source = "rust-review §3"

# ---- CONC --------------------------------------------------------------

[[rule]]
id = "CONC-1"
kind = "lint"
check = "clippy::await_holding_lock"
skills = ["style", "review"]
rule = "A lock guard is not alive across an await point."
fix = "Drop the guard before awaiting, or use an async-aware lock."
source = "rust-review §3"

[[rule]]
id = "CONC-2"
kind = "lint"
check = "clippy::await_holding_refcell_ref"
skills = ["style", "review"]
rule = "A RefCell borrow is not alive across an await point."
fix = "End the borrow before the await."
source = "rust-review §3"

[[rule]]
id = "CONC-3"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Callers' closures are not run while a lock is held, and a guard is not returned."
fix = "Copy what you need out, drop the guard, then call out."
source = "rust-review §3"

[[rule]]
id = "CONC-4"
kind = "probe"
check = "poison-into-inner"
skills = ["style", "review"]
rule = "Recovering a poisoned lock with into_inner hides that a thread panicked."
fix = "Propagate the poison, or reset the data with a reason on record."
source = "rust-review §3"

# ---- TEST --------------------------------------------------------------

[[rule]]
id = "TEST-1"
kind = "judgment"
check = ""
skills = ["review"]
rule = "Logic that decides something has a test that would fail if the logic broke."
fix = "Add the test from the contract before reading the body."
source = "rust-review §3"

[[rule]]
id = "TEST-2"
kind = "judgment"
check = ""
skills = ["review"]
rule = "A test checks behavior, not a copy of the constants it was built from."
fix = "Assert on an outcome computed another way."
source = "rust-review §3"

# ---- PORT --------------------------------------------------------------

[[rule]]
id = "PORT-1"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Before writing Rust, read the original, its tests and its callers, and list every observable behavior."
fix = "Write the behavior list, including order, ties, empties and limits."
source = "rust-port §1"

[[rule]]
id = "PORT-2"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Habits of the source language do not carry over: manual memory, out-parameters, null, globals."
fix = "List them as incidental and give them Rust forms."
source = "rust-port §1"

[[rule]]
id = "PORT-3"
kind = "judgment"
check = ""
skills = ["port"]
rule = "A bug or ambiguity in the original is kept as is and reported, not fixed in passing."
fix = "Record it in the porting notes under quirks."
source = "rust-port §1"

[[rule]]
id = "PORT-4"
kind = "probe"
check = "port-test-map"
skills = ["port"]
rule = "Every original test has exactly one Rust test whose name points back to it."
fix = "Run the inventory, fill the map, and write the missing Rust test."
source = "rust-port §2"

[[rule]]
id = "PORT-5"
kind = "judgment"
check = ""
skills = ["port"]
rule = "C and C++ idioms become owned types, Option, Result enums, return values, slices and consts."
fix = "Use the mapping in the skill; keep unsafe for FFI only."
source = "rust-port §3"

[[rule]]
id = "PORT-6"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Python idioms become enums, structs, ordered collections, stable sorts and checked integers."
fix = "Use the mapping in the skill; check string edge cases against the original."
source = "rust-port §3"

[[rule]]
id = "PORT-7"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Go, JavaScript and TypeScript idioms map to Result, Option, traits, structs and threads or tasks."
fix = "Pick numeric types on purpose and match the concurrency the original needs."
source = "rust-port §3"

[[rule]]
id = "PORT-8"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Use the standard library, not a rebuilt copy of the source language's runtime."
fix = "Call lines, trim and parse; list exotic-input differences in the notes."
source = "rust-port §4"

[[rule]]
id = "PORT-9"
kind = "judgment"
check = ""
skills = ["port"]
rule = "The port exposes the original's public surface plus the usual trait impls, and nothing more."
fix = "Drop builders and extra impls nobody asked for."
source = "rust-port §4"

[[rule]]
id = "PORT-10"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Keep the original algorithm unless it is wrong on realistic input."
fix = "Say in the notes when and why a different one was used."
source = "rust-port §4"

[[rule]]
id = "PORT-11"
kind = "judgment"
check = ""
skills = ["port"]
rule = "Compare production code size with the original; a large overshoot means the port grew."
fix = "Count code lines without tests or comments and find what swelled."
source = "rust-port §4"

[[rule]]
id = "PORT-12"
kind = "probe"
check = "porting-notes"
skills = ["port"]
rule = "A porting-notes file records the API map, test map, differences, quirks and checks run."
fix = "Write PORTING.md with those five headings."
source = "rust-port §6"
