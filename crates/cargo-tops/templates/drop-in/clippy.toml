# Rust-TOPS drop-in. Place at crate root as clippy.toml.
# allow-*-in-tests is live: tops-strict denies unwrap_used and expect_used
# and warns on dbg_macro, print_stdout, and print_stderr.
cognitive-complexity-threshold = 12
too-many-lines-threshold = 40
too-many-arguments-threshold = 6
type-complexity-threshold = 250
max-fn-params-bools = 0
avoid-breaking-exported-api = true
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
check-private-items = true
