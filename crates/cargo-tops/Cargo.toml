[package]
name = "cargo-tops"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "init / check / gate for the Rust-TOPS protocol. Orchestrates existing Cargo tools; does not replace them."
readme = "../../README.md"
homepage = "https://github.com/Hedronite/rust-tops"
documentation = "https://docs.rs/cargo-tops"
keywords = ["testing", "protocol", "ci"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "templates/**",
    "LICENSES/**",
    "Cargo.toml",
    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
publish = true

[[bin]]
name = "cargo-tops"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2.0"
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
# `openat`/`mkdirat` without `unsafe`. 1.1.5 is the version already in Cargo.lock.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }

[lints]
workspace = true
