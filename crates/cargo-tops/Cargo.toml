[package]
name = "cargo-tops"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "init / check / gate for the Rust-TOPS protocol. Orchestrates existing Cargo tools; does not replace them."
readme = "../../README.md"
homepage = "https://github.com/Hedronite/rust-tops"
documentation = "https://docs.rs/cargo-tops"
keywords = ["testing", "protocol", "ci"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "templates/**",
    "Cargo.toml",
    "LICENSE",
    "LICENSE-MIT",
    "LICENSE-APACHE",
]
publish = true

[[bin]]
name = "cargo-tops"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

[lints]
workspace = true
