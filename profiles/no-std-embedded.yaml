# First-class profile: no-std-embedded
class: no-std-embedded
coverage:
  line_min_pct: 90
  region_min_pct: 85
crap:
  threshold_human: 4
  threshold_agent: 6
mutation:
  scope: diff
  kill_rate_min_pct: 95
  unexplained_survivors_max: 0
property: required
fuzz: optional
miri: required
kani: kernels
callgrind: size-and-cycle
panic: abort
alloc: opt-in
