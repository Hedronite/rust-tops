# Rust-TOPS drop-in. Place at .config/nextest.toml

[profile.default]
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.ci]
retries = 0
fail-fast = false
slow-timeout = { period = "10s", terminate-after = 2 }
status-level = "fail"

[profile.ci.junit]
path = "junit.xml"

# Example of a nextest-native serial group. #[serial] does NOT serialize across
# nextest processes. Prefer isolation (tempdir, random port) over this.
[test-groups]
exclusive-fs = { max-threads = 1 }

# overrides must be an array (nextest rejects an empty table).
# [[profile.ci.overrides]]
# filter = 'test(exclusive_fs)'
# group = "exclusive-fs"

# `init` then `gate` for every class, with the laws layer on. This is for the
# kit suite and matches nothing in an adopter. Alone it ran in 6.0 s to 7.9 s
# on the build machine under parallel load. In the full suite it measured
# 7.8 s on a quiet run and 14 s to 18 s under load, and it timed out at 20 s
# in 2 of 10 runs. This one test gets 60 s; the profile timeout is not raised.
[[profile.ci.overrides]]
filter = "test(=fresh_init_with_laws_on_then_gate_passes_for_every_class)"
slow-timeout = { period = "10s", terminate-after = 6 }

# A dry run, then the same repo run for real, for every class. This is for the
# kit suite and matches nothing in an adopter. Alone it ran in 2.2 s to 8.6 s.
# In the full suite it measured 16.1 s to 16.7 s at a load of about 10, and
# timed out at 20 s once at a load of about 30 on the build machine. This one
# test gets 60 s; the profile timeout is not raised. (It got 40 s until the gate
# asked the pinned tools for their versions: alone at a load of 16 it then ran
# 39.8 s.)
[[profile.ci.overrides]]
filter = "test(=a_dry_run_runs_nothing_and_never_passes)"
slow-timeout = { period = "10s", terminate-after = 6 }

# `init` then `gate` for every class, with the laws layer off. This is for the
# kit suite and matches nothing in an adopter. Alone it ran in 2.4 s to 12.5 s
# in 5 runs under load on the build machine. In the full suite it measured
# 7.2 s to 10.3 s in 5 runs at a load of 10 to 16, and timed out at 20 s in
# 1 of 6 runs. This one test gets 60 s; the profile timeout is not raised. (It
# got 40 s until the gate asked the pinned tools for their versions: alone at a
# load of 16 it then timed out at 40 s.)
[[profile.ci.overrides]]
filter = "test(=fresh_init_then_gate_passes_for_every_class)"
slow-timeout = { period = "10s", terminate-after = 6 }

# These tests run real `cargo nextest` on a small crate, one build each, for
# the kit suite only; they match nothing in an adopter. Alone each ran in
# 1.4 s to 6.2 s. Under the full suite on a loaded runner they take longer,
# so they get 60 s; the profile timeout is not raised.
[[profile.ci.overrides]]
filter = "binary(gate_credit_nextest)"
slow-timeout = { period = "10s", terminate-after = 6 }

# These tests write fresh shell shims and run the `cargo-tops` binary against
# them, for the kit suite only; they match nothing in an adopter. A first run of
# each new script costs a fraction of a second on macOS, so alone the slowest
# ran in 1.9 s to 10 s. Under the full parallel suite at a load of 7 to 10 on
# the build machine, 3 of them timed out at 20 s in 4 runs. They get 60 s; the
# profile timeout is not raised.
[[profile.ci.overrides]]
filter = "binary(lock_verify)"
slow-timeout = { period = "10s", terminate-after = 6 }

# These tests run the whole gate against stub tools several times each, for
# the kit suite only; they match nothing in an adopter. Since the gate asks each
# pinned tool for its version, a gate runs about nine more commands. The slowest
# test of them ran in 2.3 s on the base and 3.4 s to 3.9 s with the pins, alone
# on the build machine. In the parallel run under coverage it timed out at 20 s
# in 3 of 4 gates at a load of 6 to 13. They get 60 s; the profile timeout is not
# raised.
[[profile.ci.overrides]]
filter = "binary(gate_survivors) | binary(gate_exemptions) | binary(gate_base)"
slow-timeout = { period = "10s", terminate-after = 6 }
